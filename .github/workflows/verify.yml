name: Verify Broby V2
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: broby
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: broby_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U broby -d broby_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BROBY_TEST_SPINE_URL: postgresql+psycopg://broby:test-only-password@localhost:5432/broby_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
