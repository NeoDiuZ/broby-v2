name: V2 synthetic scale reads

on:
  workflow_dispatch:
    inputs:
      patients:
        description: Synthetic patients to add (20–20000)
        required: true
        default: '5000'
        type: number
      requests:
        description: Concurrent authenticated reads (8–5000)
        required: true
        default: '400'
        type: number
      concurrency:
        description: Parallel clients (2–32)
        required: true
        default: '16'
        type: number

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: broby
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: broby_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U broby -d broby_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BROBY_TEST_SPINE_URL: postgresql+psycopg://broby:test-only-password@localhost:5432/broby_test
      SCALE_PATIENTS: ${{ inputs.patients }}
      SCALE_REQUESTS: ${{ inputs.requests }}
      SCALE_CONCURRENCY: ${{ inputs.concurrency }}
      SCALE_OUTPUT: /tmp/broby-v2-scale-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r api/requirements.txt
      - name: Exercise full-clinic reads, concurrency guards and crash recovery
        run: >-
          python scripts/verify-reliability.py
          --output "$SCALE_OUTPUT"
          --patients "$SCALE_PATIENTS"
          --requests "$SCALE_REQUESTS"
          --concurrency "$SCALE_CONCURRENCY"
          --skip-restore
      - name: Save non-secret measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-synthetic-scale-results
          path: ${{ env.SCALE_OUTPUT }}/results.json
          if-no-files-found: warn
          retention-days: 14
